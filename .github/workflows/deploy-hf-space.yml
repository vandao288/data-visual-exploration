name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare Hugging Face Space build files
        if: ${{ secrets.HF_USER != '' && secrets.HF_TOKEN != '' && secrets.HF_SPACE != '' }}
        run: |
          cp deploy/Dockerfile.hf Dockerfile
          cp deploy/.dockerignore.hf .dockerignore
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Dockerfile .dockerignore
          git diff --staged --quiet || git commit -m "ci: add Hugging Face Space Docker build files"

      - name: Push to Hugging Face Space
        env:
          HF_USER: ${{ secrets.HF_USER }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_USER" ] || [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_USER, HF_TOKEN, or HF_SPACE secrets not configured; skipping HF deploy."
            exit 0
          fi
          git push "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main --force
